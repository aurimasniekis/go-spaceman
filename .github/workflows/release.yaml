name: release

# Release pipeline (site/operators/install.md, ADR-0034). Runs only for pushed v* tags and manual dispatch; never on PRs.
# It builds the linux/amd64 and linux/arm64 archives, SPDX SBOMs and SHA256SUMS, builds and smoke-tests both container
# images without pushing them, and, for a v* tag only, attaches the archives, SBOMs and checksums to a DRAFT GitHub
# release. A maintainer reviews and publishes the draft by hand. No container image is pushed to any registry.
# A dispatch from a branch builds and uploads workflow artifacts but creates no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  NODE_VERSION: "24.22.0"
  SYFT_VERSION: v1.54.0

jobs:
  meta:
    name: release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      file_version: ${{ steps.meta.outputs.file_version }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      epoch: ${{ steps.meta.outputs.epoch }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ $semver ]]; then
              echo "::error::tag '$REF_NAME' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
              exit 1
            fi
            version="$REF_NAME"
            publish=true
            # Every release needs its CHANGELOG.md section; the draft release notes are taken from it.
            if ! grep -q "^## \[${version#v}\] - " CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [${version#v}] - YYYY-MM-DD' section"
              exit 1
            fi
          else
            version="v0.0.0-dev+${GITHUB_SHA:0:12}"
            publish=false
          fi
          prerelease=false
          [[ "$version" == *-* || "$version" == *+* ]] && prerelease=true
          file_version="${version#v}"
          file_version="${file_version//+/_}"
          epoch="$(git log -1 --format=%ct)"
          {
            echo "version=$version"
            echo "file_version=$file_version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "epoch=$epoch"
            echo "build_date=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    name: vet and race tests (release gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet and race tests
        env:
          SM_TEST_TX_MAX: 500ms # race detector overhead on shared runners; see ci.yaml
        run: make vet race

  web:
    name: web UI (web/dist)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install (frozen lockfile) and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: static binaries, SBOMs, checksums
    needs: [meta, test, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The built UI, embedded into spaceman by the embedui build tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: build archives, SBOMs and SHA256SUMS (CGO_ENABLED=0, -trimpath, embedded UI)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
          BUILDVCS: "true"
          SBOM: require
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: ./scripts/release-build.sh -o dist linux/amd64 linux/arm64
      - name: smoke-test the linux/amd64 binaries
        env:
          FILE_VERSION: ${{ needs.meta.outputs.file_version }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "dist/spaceman_${FILE_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/smoke"
          dir="$RUNNER_TEMP/smoke/spaceman_${FILE_VERSION}_linux_amd64"
          for bin in spaceman spaceman-agent; do
            "$dir/$bin" version --json | tee "$RUNNER_TEMP/$bin.json"
            grep -qF "\"version\":\"${VERSION}\"" "$RUNNER_TEMP/$bin.json"
            if file "$dir/$bin" | grep -q 'dynamically linked'; then echo "::error::$bin is not static"; exit 1; fi
          done
          for f in LICENSE NOTICE THIRD_PARTY.md systemd/spaceman.service systemd/spaceman-agent.service; do test -s "$dir/$f"; done
      - name: verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  images:
    name: container images (linux/amd64, build and smoke test, no push)
    needs: [meta, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the central image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: spaceman:release-smoke
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          provenance: false
          sbom: false
      - name: build the node agent base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: false
          load: true
          tags: spaceman-agent:release-smoke
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          provenance: false
          sbom: false
      - name: container smoke test
        run: ./scripts/container-smoke.sh spaceman:release-smoke spaceman-agent:release-smoke

  draft-release:
    name: draft GitHub release (archives, SBOMs, checksums)
    needs: [meta, binaries, images]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      # Created as a draft: a maintainer reviews the notes and the artifacts and publishes it by hand.
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            # This version's CHANGELOG.md section (checked to exist by the meta job).
            awk -v h="## [${TAG#v}] - " 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f && !/^\[[^]]+\]: http/' CHANGELOG.md |
              sed -E "s#\]\(([A-Za-z][^):]*)\)#](https://github.com/${GH_REPO}/blob/${TAG}/\1)#g"   # relative links
            echo
            echo "Linux (amd64, arm64) archives with \`spaceman\` (web UI embedded) and \`spaceman-agent\`, systemd units,"
            echo "example configs, SPDX SBOMs and \`SHA256SUMS\`. Verify downloads with \`sha256sum --check SHA256SUMS\`."
            echo
            echo "Container images are not published with this release; build them from the tagged source"
            echo "(site/operators/containers.md). No image contains herdr-core or harness CLIs, and the node agent"
            echo "image is not agent-ready by itself."
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md)."
          } >"$notes"
          flags=(--draft --verify-tag --title "$TAG" --notes-file "$notes")
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*
