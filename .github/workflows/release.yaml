name: release

# Release pipeline (site/operators/install.md, ADR-0034). Runs only for pushed v* tags and manual dispatch; never on PRs.
# Nothing is built until the gates pass: vet, race tests, the coverage floor, the fuzz smoke and the full site check with
# its accessibility audit (ADR-0062; what to do when one fails: site/development/testing.md). It builds the linux/amd64 and linux/arm64 archives, SPDX SBOMs and SHA256SUMS, builds and smoke-tests both container
# images, and, for a v* tag only, pushes both images to Docker Hub (when the repository secret DOCKERHUB_TOKEN is set)
# and attaches the archives, SBOMs and checksums to a DRAFT GitHub release. A maintainer reviews and publishes the draft
# by hand.
# A dispatch from a branch builds and uploads workflow artifacts but creates no release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  DOCKERHUB_USER: aurimasniekis
  DOCKERHUB_NAMESPACE: docker.io/aurimasniekis
  NODE_VERSION: "24.22.0"
  SYFT_VERSION: v1.54.0

jobs:
  meta:
    name: release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      file_version: ${{ steps.meta.outputs.file_version }}
      publish: ${{ steps.meta.outputs.publish }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      epoch: ${{ steps.meta.outputs.epoch }}
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ "$REF_TYPE" == "tag" ]]; then
            if [[ ! "$REF_NAME" =~ $semver ]]; then
              echo "::error::tag '$REF_NAME' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
              exit 1
            fi
            version="$REF_NAME"
            publish=true
            # Every release needs its CHANGELOG.md section; the draft release notes are taken from it.
            if ! grep -q "^## \[${version#v}\] - " CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [${version#v}] - YYYY-MM-DD' section"
              exit 1
            fi
          else
            version="v0.0.0-dev+${GITHUB_SHA:0:12}"
            publish=false
          fi
          prerelease=false
          [[ "$version" == *-* || "$version" == *+* ]] && prerelease=true
          file_version="${version#v}"
          file_version="${file_version//+/_}"
          epoch="$(git log -1 --format=%ct)"
          {
            echo "version=$version"
            echo "file_version=$file_version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
            echo "epoch=$epoch"
            echo "build_date=$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
          } >>"$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  test:
    name: vet, race tests and coverage floor (release gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: vet and race tests
        env:
          SM_TEST_TX_MAX: 1s # race detector overhead on shared runners; see ci.yaml
          RACE_APP_PARALLEL: "4" # internal/app's own invocation keeps the runner-sized cap; see ci.yaml
        run: make vet race RACE_COUNT=1 # every test runs (only local runs use go test's cache)
      - name: coverage floor (non-race, so the write-transaction guard applies)
        # 1 s on GitHub's hosted runners, as in ci.yaml; 100 ms locally (ADR-0062, update 2026-11-13).
        env:
          SM_TEST_TX_MAX: 1s
          # One package at a time, as before ADR-0069: more at once on a 4-core runner adds lock-hold noise.
          COVERAGE_PARALLEL: "1"
        run: make coverage

  login-timing:
    name: login timing, known vs unknown account (release gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: login timing
        # The wall-clock comparison of Hallpass HP-AUTH-005, alone on its runner without the race detector or coverage,
        # as in ci.yaml (ADR-0071). 250 ms write-transaction guard on hosted runners, as in ci.yaml (ADR-0062).
        env:
          SM_TEST_TX_MAX: 250ms
        run: make test-login-timing

  fuzz:
    name: fuzz smoke (release gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: every Fuzz target for 10 s
        env:
          SM_TEST_TX_MAX: 250ms # write-transaction guard on hosted runners, as in ci.yaml (ADR-0062)
        run: make fuzz-smoke FUZZTIME=10s

  site:
    name: site, Mermaid, API reference drift and full accessibility audit (release gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            site/pnpm-lock.yaml
            web/pnpm-lock.yaml
      - name: install (frozen lockfiles)
        run: |
          (cd site && pnpm install --frozen-lockfile)
          (cd web && pnpm install --frozen-lockfile)
      - name: chromium for the Mermaid check and the accessibility audit
        run: npx --yes playwright@1.64.1 install --with-deps chromium
      # Always the full audit, whatever changed since the last release (ADR-0062).
      - name: build, Mermaid, API reference drift and axe on every page
        env:
          SM_SITE_A11Y: "1"
        run: make site-check

  web:
    name: web UI (web/dist)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install (frozen lockfile) and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: static binaries, SBOMs, checksums
    needs: [meta, test, login-timing, fuzz, site, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The built UI, embedded into spaceman by the embedui build tag.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - name: install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: build archives, SBOMs and SHA256SUMS (CGO_ENABLED=0, -trimpath, embedded UI)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ needs.meta.outputs.epoch }}
          BUILDVCS: "true"
          SBOM: require
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: ./scripts/release-build.sh -o dist linux/amd64 linux/arm64
      - name: smoke-test the linux/amd64 binaries
        env:
          FILE_VERSION: ${{ needs.meta.outputs.file_version }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "dist/spaceman_${FILE_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/smoke"
          dir="$RUNNER_TEMP/smoke/spaceman_${FILE_VERSION}_linux_amd64"
          for bin in spaceman spaceman-agent; do
            "$dir/$bin" version --json | tee "$RUNNER_TEMP/$bin.json"
            grep -qF "\"version\":\"${VERSION}\"" "$RUNNER_TEMP/$bin.json"
            if file "$dir/$bin" | grep -q 'dynamically linked'; then echo "::error::$bin is not static"; exit 1; fi
          done
          for f in LICENSE NOTICE THIRD_PARTY.md systemd/spaceman.service systemd/spaceman-agent.service; do test -s "$dir/$f"; done
      - name: verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  images:
    name: container images (linux/amd64, build and smoke test, no push)
    needs: [meta, test, login-timing, fuzz, site]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the central image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: spaceman:release-smoke
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          provenance: false
          sbom: false
      - name: build the node agent base image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64
          push: false
          load: true
          tags: spaceman-agent:release-smoke
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          provenance: false
          sbom: false
      - name: container smoke test
        run: ./scripts/container-smoke.sh spaceman:release-smoke spaceman-agent:release-smoke

  # Docker Hub (ADR-0055): docker.io/aurimasniekis/spaceman and docker.io/aurimasniekis/spaceman-agent, linux/amd64 and
  # linux/arm64, tagged with the version (and latest for a final release), with SBOM and provenance attestations. Only
  # for a v* tag and only when the repository secret DOCKERHUB_TOKEN (a Docker Hub access token with Read & Write scope)
  # is set; otherwise the release goes ahead without images and says so.
  image-publish:
    name: publish ${{ matrix.image }} to Docker Hub (linux/amd64, linux/arm64)
    needs: [meta, images]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: spaceman
            file: Dockerfile
          - image: spaceman-agent
            file: Dockerfile.agent
    outputs:
      dockerhub: ${{ steps.dockerhub.outputs.enabled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Secrets cannot be tested in `if:` directly; this step turns "secret present" into a step output.
      - name: Docker Hub configured?
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_TOKEN" ]]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::repository secret DOCKERHUB_TOKEN is not set; no image is published"
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          fi
      # The final stages install packages, so the arm64 build runs under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.dockerhub.outputs.enabled == 'true'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.dockerhub.outputs.enabled == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.dockerhub.outputs.enabled == 'true'
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: image tags
        id: tags
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          REPO: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          FILE_VERSION: ${{ needs.meta.outputs.file_version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          tags="${REPO}:${FILE_VERSION}"
          if [[ "$PRERELEASE" != "true" ]]; then tags="${tags},${REPO}:latest"; fi
          echo "tags=$tags" >>"$GITHUB_OUTPUT"
          echo "repo=$REPO" >>"$GITHUB_OUTPUT"
      - name: build and push
        id: push
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.meta.outputs.build_date }}
          provenance: mode=max
          sbom: true
      - name: build provenance attestation
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: record the digest
        if: steps.dockerhub.outputs.enabled == 'true'
        env:
          REPO: ${{ steps.tags.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
          FILE_VERSION: ${{ needs.meta.outputs.file_version }}
        run: echo "- \`${REPO}:${FILE_VERSION}\` (\`${REPO}@${DIGEST}\`)" >"$RUNNER_TEMP/${{ matrix.image }}.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.dockerhub.outputs.enabled == 'true'
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.md

  draft-release:
    name: draft GitHub release (archives, SBOMs, checksums)
    needs: [meta, binaries, images, image-publish]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.image-publish.outputs.dockerhub == 'true'
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      # Created as a draft: a maintainer reviews the notes and the artifacts and publishes it by hand.
      - name: create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.version }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/notes.md"
          {
            # This version's CHANGELOG.md section (checked to exist by the meta job).
            awk -v h="## [${TAG#v}] - " 'index($0, h) == 1 {f = 1; next} f && /^## \[/ {exit} f && !/^\[[^]]+\]: http/' CHANGELOG.md |
              sed -E "s#\]\(([A-Za-z][^):]*)\)#](https://github.com/${GH_REPO}/blob/${TAG}/\1)#g"   # relative links
            echo
            echo "Linux (amd64, arm64) archives with \`spaceman\` (web UI embedded) and \`spaceman-agent\`, systemd units,"
            echo "example configs, SPDX SBOMs and \`SHA256SUMS\`. Verify downloads with \`sha256sum --check SHA256SUMS\`."
            echo
            if compgen -G "$RUNNER_TEMP/images/*.md" >/dev/null; then
              echo "Container images (linux/amd64, linux/arm64; site/operators/containers.md):"
              echo
              cat "$RUNNER_TEMP"/images/*.md
              echo
              echo "No image contains herdr-core or harness CLIs, and the node agent image is not agent-ready by itself."
            else
              echo "Container images are not published with this release; build them from the tagged source"
              echo "(site/operators/containers.md). No image contains herdr-core or harness CLIs, and the node agent"
              echo "image is not agent-ready by itself."
            fi
            echo
            echo "Full history: [CHANGELOG.md](https://github.com/${GH_REPO}/blob/${TAG}/CHANGELOG.md)."
          } >"$notes"
          flags=(--draft --verify-tag --title "$TAG" --notes-file "$notes")
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" dist/*
